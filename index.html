<style id="css">
:root{--bg:#f6f4ef;--surface:#fff;--ink:#14213d;--muted:#5b6478;--line:#e2ddd0;--accent:#c98a00;--accent-ink:#fff;--hero:#14213d;--hero-ink:#fff;--chip:#ece7da;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

:root[data-theme="dark"]{color-scheme:dark;--bg:#0d1424;--surface:#161f35;--ink:#f1efe8;--muted:#a3abc0;--line:#27324d;--accent:#f2b705;--accent-ink:#14213d;--hero:#0a0f1c;--hero-ink:#f1efe8;--chip:#1f2a45}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;line-height:1.5}
header{background:var(--hero);color:var(--hero-ink);padding:28px 20px 34px}
.wrap{max-width:1040px;margin:0 auto}

button{font:600 14px Inter,system-ui,sans-serif;cursor:pointer}
.chip{border:1px solid var(--line);background:var(--chip);color:var(--ink);padding:8px 16px;border-radius:999px}

.btn{border-radius:10px;padding:10px 14px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.band{height:70px;display:flex;align-items:flex-end;padding:10px 14px;color:#fff;font:600 12px Inter,sans-serif;letter-spacing:.1em;text-transform:uppercase}
.band.single{background:linear-gradient(135deg,#1d3a6e,#0f1f40)}.band.pack{background:linear-gradient(135deg,#8a5a00,#c98a00)}
.body{padding:14px;display:flex;flex-direction:column;gap:6px;flex:1}
.name{font-weight:700;font-size:16px;line-height:1.25}.meta{color:var(--muted);font-size:13px}.note{font-size:13px}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:10px;gap:8px}
.price{font-weight:700;font-size:20px}.price small{font-weight:400;color:var(--muted);font-size:12px}
.add:disabled{opacity:.55;cursor:default}
.info{margin-top:30px;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}

.share{display:flex;gap:16px;align-items:center;flex-wrap:wrap}

.share a{color:var(--accent);word-break:break-all}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--hero);color:var(--hero-ink);padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;align-items:center;gap:12px;z-index:5}
.admin{position:sticky;top:0;z-index:6;background:var(--accent);color:var(--accent-ink);padding:8px 20px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px}
.admin span{flex:1;min-width:180px}
.admin button{background:var(--hero);color:var(--hero-ink);border:0}
.panel{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:10;align-items:flex-end;justify-content:center}
.panel.open{display:flex}
.sheet{background:var(--surface);color:var(--ink);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:16px 16px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px))}
.line{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.line button{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:13px}
textarea,input,select{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:8px;font:14px Inter,system-ui,sans-serif;margin-top:6px}
textarea{height:140px}.ed textarea{height:58px}
label{font-size:12px;color:var(--muted);display:block;margin-top:6px}
.row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.row button{flex:1;min-width:120px}
.hint{color:var(--muted);font-size:13px;margin:8px 0 0}.empty{color:var(--muted);padding:16px 0}
.ed label.chk{display:flex;gap:8px;align-items:center;color:var(--ink)}.ed label.chk input{width:auto;margin:0}
</style>
</head>
<body>

"pack","name":"1998 Pacific Paramount Pack","meta":"23 cards · Baseball","note":"Throwbacks like Paul O’Neill, Eric Karros, Gary Gaetti.","price":23},{"id":"p5","t":"pack","name":"1988 Topps Pack","meta":"24 cards · Baseball","note":"Classic 80s cardboard, Dave Concepcion and more.","price":24},{"id":"p6","t":"pack","name":"1990 Donruss Pack","meta":"22 cards · Baseball","note":"Includes Julio Franco, Ruben Sierra, Storm Davis.","price":22},{"id":"p7","t":"pack","name":"2020 Contenders Draft Picks Pack","meta":"25 cards · Football","note":"College draft cards like Carson Wentz and Mason Rudolph.","price":25},{"id":"p8","t":"pack","name":"2006 Upper Deck Pack","meta":"24 cards · Football","note":"Includes Tom Brady, Willis McGahee, Joey Galloway.","price":24}]}</script>
<script id="code">
var S=JSON.parse(document.getElementById("data").textContent),D=null,editing=false,owner=false,artifactNS=null,cart={},filter="all";
var HEAD='<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>'+"__T__"+'</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&display=swap">';
var R=document.getElementById("root");
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e;}
function money(n){return "$"+n.toFixed(2).replace(/\.00$/,"");}
function cur(){return editing?D:S;}
function safeUrl(u){return /^https:\/\//i.test(u||"")?u:"";}
function inField(label,val,cb,opts){opts=opts||{};var w=el("div");w.appendChild(el("label",null,label));var i=el(opts.area?"textarea":"input");i.value=val==null?"":val;if(opts.ph)i.placeholder=opts.ph;i.addEventListener("input",function(){cb(i.value);});w.appendChild(i);return w;}
function btn(txt,cls,fn){var b=el("button","btn "+cls,txt);b.addEventListener("click",fn);return b;}
function chosen(){return S.items.filter(function(i){return cart[i.id]&&!i.out;});}
function total(){return chosen().reduce(function(s,i){return s+(i.price||0);},0);}
function render(){
  var st=cur().store,items=cur().items;R.textContent="";
  if(owner){var a=el("div","admin");
    if(!editing){a.appendChild(el("span",null,"Owner mode. Edit prices and items here, then download the updated file."));a.appendChild(btn("Edit store","sec",function(){D=JSON.parse(JSON.stringify(S));editing=true;render();}));}
    else{a.appendChild(el("span",null,"Editing. Press Download to save your changes, then upload that file to your host."));a.appendChild(btn("Download updated store","pri",publish));a.appendChild(btn("Cancel","sec",function(){editing=false;D=null;render();}));}
    R.appendChild(a);}
  var h=el("header"),w=el("div","wrap");w.appendChild(el("div","logo",st.name));w.appendChild(el("div","tag",st.tag));w.appendChild(el("h1",null,st.hero));w.appendChild(el("p","sub",st.sub));h.appendChild(w);R.appendChild(h);
  var m=el("main","wrap");
  if(editing){var c=el("div","card ed");c.appendChild(el("h3",null,"Store settings"));
    [["Store name","name"],["Tagline","tag"],["Headline","hero"],["Intro text","sub"],["Contact email (shows an Email order button)","email"],["Facebook or other link (https://...)","fb"],["Payment instructions (for example: Venmo @name)","pay"],["Shipping note","ship"]].forEach(function(f){c.appendChild(inField(f[0],D.store[f[1]],function(v){D.store[f[1]]=v;},{area:f[1]==="sub"||f[1]==="ship"}));});
    m.appendChild(c);}
  var ch=el("div","chips");[["all","All"],["single","Singles"],["pack","Packs"]].forEach(function(f){var b=el("button","chip",f[1]);b.setAttribute("aria-pressed",String(filter===f[0]));b.addEventListener("click",function(){filter=f[0];render();});ch.appendChild(b);});m.appendChild(ch);
  [["single","Singles"],["pack","Packs (20+ cards, same set)"]].forEach(function(s){
    if(filter!=="all"&&filter!==s[0])return;
    m.appendChild(el("h2",null,s[1]));var g=el("div","grid");
    items.forEach(function(i,idx){if(i.t!==s[0])return;g.appendChild(editing?editCard(i,idx):shopCard(i));});m.appendChild(g);
    if(editing)m.appendChild(btn("+ Add "+(s[0]==="pack"?"pack":"single"),"sec",function(){D.items.push({id:"i"+Date.now(),t:s[0],name:"New item",meta:"",note:"",price:0,out:false});render();}));});
  var inf=el("div","info");
  var c1=el("div","card");c1.appendChild(el("h3",null,"How ordering works"));c1.appendChild(el("p",null,"Add cards to your order, then send it to "+st.name+". We confirm availability, shipping, and payment with you directly."));if(st.pay)c1.appendChild(el("p",null,"Payment: "+st.pay));inf.appendChild(c1);
  var c2=el("div","card");c2.appendChild(el("h3",null,"Condition and shipping"));c2.appendChild(el("p",null,"Cards are raw (not graded) unless noted. Extra photos are available on request."));c2.appendChild(el("p",null,st.ship));inf.appendChild(c2);
  if(S.qr&&safeUrl(S.store.url)){var c3=el("div","card");c3.appendChild(el("h3",null,"Share this store"));var sh=el("div","share");var img=el("img");img.src=S.qr;img.alt="QR code for the "+st.name+" store";sh.appendChild(img);
  var sd=el("div");var u=el("a",null,S.store.url);u.href=safeUrl(S.store.url);u.target="_blank";u.rel="noopener";sd.appendChild(u);
  sd.appendChild(btn("Save QR code","sec",saveQR));sh.appendChild(sd);c3.appendChild(sh);inf.appendChild(c3);}
  if(safeUrl(st.fb)){var c4=el("div","card");c4.appendChild(el("h3",null,"Contact"));var l=el("a",null,"Message "+st.name);l.href=safeUrl(st.fb);l.target="_blank";l.rel="noopener";c4.appendChild(l);inf.appendChild(c4);}
  m.appendChild(inf);R.appendChild(m);
  var bar=el("div","bar");bar.appendChild(el("span",null,summary()));bar.appendChild(btn("Review order","pri",openPanel));R.appendChild(bar);
  var p=el("div","panel");p.id="panel";p.setAttribute("role","dialog");p.setAttribute("aria-modal","true");R.appendChild(p);
}
function summary(){var n=chosen().length;return n?(n+(n===1?" item · ":" items · ")+money(total())):"Your order is empty";}
function shopCard(i){
  var c=el("div","item"),b=el("div","band "+i.t,i.t==="pack"?"Pack":"Single");c.appendChild(b);
  var body=el("div","body");body.appendChild(el("div","name",i.name));body.appendChild(el("div","meta",i.meta));body.appendChild(el("div","note",i.note));
  var f=el("div","foot"),p=el("div","price");if(i.price==null)p.appendChild(el("small",null,"Make an offer"));else p.textContent=money(i.price);
  var a=el("button","btn pri add",i.out?"Sold out":(cart[i.id]?"Added ✓":"Add"));a.disabled=!!(i.out||cart[i.id]);
  a.addEventListener("click",function(){cart[i.id]=true;render();});f.appendChild(p);f.appendChild(a);body.appendChild(f);c.appendChild(body);return c;
}
function editCard(i,idx){
  var c=el("div","item ed"),body=el("div","body");
  body.appendChild(inField("Name",i.name,function(v){i.name=v;}));body.appendChild(inField("Details (set, sport, condition)",i.meta,function(v){i.meta=v;}));
  body.appendChild(inField("Description",i.note,function(v){i.note=v;},{area:true}));
  body.appendChild(inField("Price in dollars (leave blank for 'make an offer')",i.price==null?"":i.price,function(v){var n=parseFloat(v);i.price=(v.trim()===""||isNaN(n)||n<0)?null:n;}));
  var l=el("label","chk"),k=el("input");k.type="checkbox";k.checked=!!i.out;k.addEventListener("change",function(){i.out=k.checked;});l.appendChild(k);l.appendChild(document.createTextNode("Sold out"));body.appendChild(l);
  var r=el("div","row");r.appendChild(btn("Delete","sec",function(){if(confirm("Delete this item?")){D.items.splice(idx,1);render();}}));body.appendChild(r);c.appendChild(body);return c;
}
function orderText(){
  var l=chosen();if(!l.length)return "";var who=(document.getElementById("who")||{}).value||"";who=who.trim();
  var t="Order request for "+S.store.name+(who?" from "+who:"")+":\n\n";
  l.forEach(function(i){t+="- "+i.name+" ("+i.meta+") "+(i.price==null?"offer: ____":money(i.price))+"\n";});
  return t+"\nItems: "+l.length+"\nSubtotal: "+money(total())+(l.some(function(i){return i.price==null;})?" plus offers":"")+"\n\nPlease confirm availability, shipping, and payment.";
}
function openPanel(){
  var p=document.getElementById("panel");p.textContent="";p.classList.add("open");var s=el("div","sheet");p.appendChild(s);
  s.appendChild(el("h2",null,"Your order"));var l=chosen();

  l.forEach(function(i){var r=el("div","line");r.appendChild(el("span",null,i.name+" · "+(i.price==null?"offer":money(i.price))));r.appendChild(btn("Remove","",function(){delete cart[i.id];render();openPanel();}));s.appendChild(r);});
  if(l.length)s.appendChild(el("p","hint","Subtotal: "+money(total())+" (shipping confirmed separately)"));
  var who=el("input");who.id="who";who.placeholder="Your name (optional)";s.appendChild(who);
  var ta=el("textarea");ta.id="msg";ta.readOnly=true;ta.value=orderText();s.appendChild(ta);who.addEventListener("input",function(){ta.value=orderText();});
  var st=el("p","hint","Send the copied order to "+S.store.name+" to confirm payment and shipping.");
  var r=el("div","row");
  r.appendChild(btn("Copy order","pri",function(){if(!ta.value){st.textContent="Add a card first.";return;}ta.select();var ok=function(){st.textContent="Copied. Now send it to "+S.store.name+".";};
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(ta.value).then(ok,function(){document.execCommand("copy");ok();});else{try{document.execCommand("copy");ok();}catch(e){st.textContent="Select the text above and copy it.";}}}));
  if(S.store.email)r.appendChild(btn("Email order","sec",function(){if(ta.value)location.href="mailto:"+S.store.email+"?subject="+encodeURIComponent(S.store.name+" order request")+"&body="+encodeURIComponent(ta.value);}));
  r.appendChild(btn("Keep shopping","sec",function(){p.classList.remove("open");}));s.appendChild(r);s.appendChild(st);
}
function saveQR(){var a=document.createElement("a");a.href=S.qr;a.download="316-sc-qr.png";document.body.appendChild(a);a.click();a.remove();}
function buildDoc(state){
  var j=JSON.stringify(state).split("</").join("<\\/");
  return "<!DOCTYPE html>\n<html lang=\"en\"><head>"+HEAD.replace("__T__",(state.store.name+" | "+state.store.tag).replace(/[<>&]/g,""))+"<style id=\"css\">"+document.getElementById("css").textContent+"</style></head><body><div id=\"root\"></div><script type=\"application/json\" id=\"data\">"+j+"<\/script><script id=\"code\">"+document.getElementById("code").textContent+"<\/script></body></html>";
}
function publish(){
  if(!D.store.name.trim()){alert("Give the store a name.");return;}
  var blob=new Blob([buildDoc(D)],{type:"text/html"});var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="index.html";document.body.appendChild(a);a.click();a.remove();
  alert("Downloaded index.html. Upload it to your host in place of the old file to update the live store.");
}
function checkOwner(){owner=location.hash==="#edit";if(!owner){editing=false;D=null;}render();}
window.addEventListener("hashchange",checkOwner);checkOwner();
</script>

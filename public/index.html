  var p=document.getElementById("panel");if(!p.classList.contains("open"))lastFocus=document.activeElement;
  p.textContent="";p.classList.add("open");document.removeEventListener("keydown",panelKeys);document.addEventListener("keydown",panelKeys);
  p.onclick=function(e){if(e.target===p)closePanel();};
  var s=el("div","sheet");s.setAttribute("role","dialog");s.setAttribute("aria-modal","true");s.setAttribute("aria-labelledby","ptitle");p.appendChild(s);
  var hd=el("h2",null,"Your order");hd.id="ptitle";hd.tabIndex=-1;s.appendChild(hd);var l=chosen();
  if(!l.length)s.appendChild(el("p","empty","Nothing here yet. Add some cards to start."));
  var ul=el("ul","lines");l.forEach(function(i){var r=el("li","line");r.appendChild(el("span",null,i.name+" · "+(i.price==null?"offer":money(i.price))));var rb=btn("Remove","",function(){delete cart[i.id];render();openPanel();say("Removed "+i.name+". "+summary()+".");});rb.setAttribute("aria-label","Remove "+i.name);r.appendChild(rb);ul.appendChild(r);});if(l.length)s.appendChild(ul);
  if(l.length)s.appendChild(el("p","hint","Subtotal: "+money(total())+" (shipping confirmed separately)"));
  var wl=el("label",null,"Your name (optional)");wl.htmlFor="who";s.appendChild(wl);var who=el("input");who.id="who";who.autocomplete="name";s.appendChild(who);
  var tl=el("label",null,"Order message");tl.htmlFor="msg";s.appendChild(tl);var ta=el("textarea");ta.id="msg";ta.readOnly=true;ta.value=orderText();s.appendChild(ta);who.addEventListener("input",function(){ta.value=orderText();});
  var st=el("p","hint","Send the copied order to "+S.store.name+" to confirm payment and shipping.");st.setAttribute("role","status");
  var r=el("div","row");
  r.appendChild(btn("Copy order","pri",function(){if(!ta.value){st.textContent="Add a card first.";return;}ta.select();copy(ta.value,function(ok){if(!ok){try{ok=document.execCommand("copy");}catch(e){}}st.textContent=ok?"Copied. Now send it to "+S.store.name+".":"Select the text above and copy it.";});}));
  if(S.store.email)r.appendChild(btn("Email order","sec",function(){if(ta.value)location.href="mailto:"+S.store.email+"?subject="+encodeURIComponent(S.store.name+" order request")+"&body="+encodeURIComponent(ta.value);}));
  r.appendChild(btn("Keep shopping","sec",closePanel));s.appendChild(r);s.appendChild(st);
  hd.focus();
}
function saveQR(){var a=document.createElement("a");a.href=S.qr;a.download="316-sc-qr.png";document.body.appendChild(a);a.click();a.remove();}

async function api(method,body){
  var r=await fetch("/api/store"+(method==="GET"&&user?"?me":""),{method:method,credentials:"same-origin",headers:body?{"Content-Type":"application/json"}:{},body:body?JSON.stringify(body):undefined});
  var j=await r.json().catch(function(){return {};});if(!r.ok)throw new Error(j.error||"Something went wrong. Please try again.");return j;
}
async function load(){
  try{var j=await api("GET");if(j.data)S=j.data;owner=!!j.owner;}catch(e){}
  if(!editing)render();
}
async function save(){
  if(!D.store.name.trim()){alert("Give the store a name.");return;}
  saving=true;render();
  try{var j=await api("PUT",D);S=j.data;editing=false;D=null;saving=false;focusK="edit";render();say("Saved. Your changes are live.");}
  catch(e){saving=false;focusK="save";render();say(e.message);alert(e.message);}
}
function authError(e){
  if(e instanceof AuthError){if(e.status===401)return "Wrong email or password.";if(e.status===422)return "Check your email and password (passwords need at least 8 characters).";return e.message;}
  return "Sign in isn't available right now. Please try again later.";
}
async function authSubmit(st,v){
  auth.msg="";
  try{
    if(st==="login"){user=await login(v.email.trim(),v.pw);}
    else if(st==="forgot"){await requestPasswordRecovery(v.email.trim());auth={step:"login",msg:"If that email has an account, a reset link is on its way."};render();return;}
    else if(st==="invite"){user=await acceptInvite(auth.token,v.pw);}
    else if(st==="recovery"){await updateUser({password:v.pw});user=await getUser();}
    auth={step:"login",msg:""};cred.pw="";await load();focusK="edit";render();say(owner?"Signed in. You can edit the store.":"Signed in.");
  }catch(e){auth.msg=authError(e);render();}
}
async function signOut(){try{await logout();}catch(e){}user=null;owner=false;editing=false;D=null;if(location.hash==="#edit")history.replaceState(null,"",location.pathname);render();say("Signed out.");}

window.addEventListener("hashchange",function(){render();if(location.hash==="#edit"&&!user){var f=R.querySelector(".admin input");if(f)f.focus();}});
render();
(async function(){
  try{var cb=await handleAuthCallback();
    if(cb&&cb.type==="invite"){auth={step:"invite",msg:"",token:cb.token};location.hash="#edit";}
    else if(cb&&cb.type==="recovery"){auth={step:"recovery",msg:""};location.hash="#edit";}
  }catch(e){auth.msg=authError(e);}
  try{if(auth.step!=="invite")user=await getUser();}catch(e){}
  // A recovery link signs the user in; keep them on the "choose a new password" step until they set it.
  if(auth.step==="recovery")user=null;
  await load();
  onAuthChange(function(ev,u){if(ev==="logout"&&user){user=null;owner=false;editing=false;render();}});
})();
</script>
